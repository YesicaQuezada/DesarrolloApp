<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Mi Biblioteca de Mangas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <section class="welcome">
    <h2>¡Hola de nuevo!</h2>
    <p>Descubre mangas para sumar a tu biblioteca.</p>
  </section>

  <section class="manga-section">
    <div class="section-heading">
      <div>
        <h2>Mangas populares</h2>
        <p>Una selección para empezar a explorar</p>
      </div>
    </div>

    <div class="loading-state" *ngIf="isLoading()">
      <ion-spinner name="crescent" aria-label="Cargando mangas"></ion-spinner>
      <span>Cargando mangas...</span>
    </div>

    <div class="error-state" *ngIf="errorMessage() as error">
      <p>{{ error }}</p>
      <ion-button fill="outline" size="small" (click)="loadMangas()">Reintentar</ion-button>
    </div>

    <ion-grid class="manga-grid" *ngIf="!isLoading() && mangas().length">
      <ion-row>
        <ion-col size="6" size-sm="4" size-md="3" size-lg="2" *ngFor="let manga of mangas()">
          <ion-card class="manga-card">
            <img
              *ngIf="getCoverImage(manga) as coverImage"
              [src]="coverImage"
              [alt]="'Portada de ' + manga.title"
              loading="lazy"
            />
            <div class="cover-placeholder" *ngIf="!getCoverImage(manga)">Sin portada</div>
            <ion-card-header>
              <ion-card-title>{{ manga.title }}</ion-card-title>
              <ion-card-subtitle *ngIf="manga.score">★ {{ manga.score }}</ion-card-subtitle>
            </ion-card-header>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>

    <p class="empty-state" *ngIf="!isLoading() && !errorMessage() && mangas().length === 0">
      No se encontraron mangas.
    </p>
  </section>
</ion-content>
