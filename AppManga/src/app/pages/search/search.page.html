<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Buscar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-search (buscar)="alBuscar($event)"></app-search>

  <ion-list>
    @for (m of resultados; track m.id) {
      <ion-item>
        <ion-thumbnail slot="start">
          <img [src]="m.imagen" [alt]="m.titulo" />
        </ion-thumbnail>
        <ion-label>
          <h2>{{ m.titulo }}</h2>
          <p>{{ m.autor }} · {{ m.genero }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>

  @if (resultados.length === 0) {
    <p class="ion-text-center ion-padding">
      No se encontraron resultados.
    </p>
  }
</ion-content>
