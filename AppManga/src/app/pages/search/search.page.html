<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mangas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-spinner *ngIf="isLoading()" name="crescent" aria-label="Cargando mangas"></ion-spinner>

  <ion-text color="danger" *ngIf="errorMessage() as error">
    <p>{{ error }}</p>
  </ion-text>

  <ion-grid *ngIf="!isLoading() && mangas().length">
    <ion-row>
      <ion-col size="6" size-md="4" size-lg="3" *ngFor="let manga of mangas()">
        <ion-card class="manga-card">
          <img
            *ngIf="getCoverImage(manga) as coverImage"
            [src]="coverImage"
            [alt]="'Portada de ' + manga.title"
            loading="lazy"
          />
          <div class="cover-placeholder" *ngIf="!getCoverImage(manga)">
            Sin portada
          </div>
          <ion-card-header>
            <ion-card-title>{{ manga.title }}</ion-card-title>
            <ion-card-subtitle *ngIf="manga.score">Puntuación: {{ manga.score }}</ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <p *ngIf="!isLoading() && !errorMessage() && mangas().length === 0">
    No se encontraron mangas.
  </p>
</ion-content>
