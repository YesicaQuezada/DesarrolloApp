<ion-card class="anime-card" (click)="onClick()" button>
  <div class="anime-card__cover">
    <img
      [src]="anime.images.jpg.large_image_url"
      [alt]="anime.title"
      loading="lazy"
    />
    <button
      type="button"
      class="anime-card__fav"
      [class.anime-card__fav--activa]="esFavorito"
      [attr.aria-label]="
        esFavorito ? 'Quitar de favoritos' : 'Agregar a favoritos'
      "
      (click)="alternarFavorito($event)"
    >
      <ion-icon [name]="esFavorito ? 'heart' : 'heart-outline'"></ion-icon>
    </button>
  </div>
  <ion-card-header class="anime-card__header">
    <ion-card-title class="anime-card__title">{{ anime.title }}</ion-card-title>
  </ion-card-header>
</ion-card>
