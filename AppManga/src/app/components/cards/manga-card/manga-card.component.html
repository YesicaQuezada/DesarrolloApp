<ion-card class="manga-card" (click)="onClick()" button>
  <div class="manga-card__cover">
    <img
      [src]="manga.images.jpg.large_image_url"
      [alt]="manga.title"
      loading="lazy"
    />
    <button
      type="button"
      class="manga-card__fav"
      [class.manga-card__fav--activa]="esFavorito"
      [attr.aria-label]="
        esFavorito ? 'Quitar de favoritos' : 'Agregar a favoritos'
      "
      (click)="alternarFavorito($event)"
    >
      <ion-icon [name]="esFavorito ? 'heart' : 'heart-outline'"></ion-icon>
    </button>
  </div>
  <ion-card-header class="manga-card__header">
    <ion-card-title class="manga-card__title">{{ manga.title }}</ion-card-title>
  </ion-card-header>
</ion-card>
