<ion-toolbar>
  <app-media-segment
    [valor]="tipo"
    (valorChange)="alCambiarSegmento($event)"
  ></app-media-segment>
</ion-toolbar>

<ion-searchbar
  [placeholder]="tipo === 'anime' ? 'Buscar anime' : 'Buscar manga, autor o género'"
  [debounce]="300"
  show-clear-button="always"
  clear-icon="trash-bin"
  (ionInput)="alEscribir($event)">
</ion-searchbar>
