<ion-header>
  <ion-toolbar>
    <ion-segment [(ngModel)]="segmentoActual">
      <ion-segment-button value="anime">
        <ion-label>Anime</ion-label>
      </ion-segment-button>

      <ion-segment-button value="manga">
        <ion-label>Manga</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (segmentoActual === 'anime') {
    <app-list-card
      [titulo]="'Mis animes'"
      [subTitulo]="'La lista de mis animes favoritos en un solo lugar'"
    ></app-list-card>
  }

  @if (segmentoActual === 'manga') {
    <app-list-card
      [titulo]="'Mis mangas'"
      [subTitulo]="'La lista de mis animes favoritos en un solo lugar'"
    ></app-list-card>
  }
</ion-content>
