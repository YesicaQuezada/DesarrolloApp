<ion-header>
  <ion-toolbar>
    <ion-segment [(ngModel)]="segmentoActual" (ionChange)="cambiarSegmento($event)">
      <ion-segment-button value="anime">
        <ion-label>Anime</ion-label>
      </ion-segment-button>

      <ion-segment-button value="manga">
        <ion-label>Manga</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (sinSesion) {
    <div class="favoritos__mensaje">
      <p>Inicia sesión para ver tus favoritos.</p>
      <ion-button routerLink="/login">Ir a iniciar sesión</ion-button>
    </div>
  } @else if (error) {
    <ion-text color="danger">
      <p class="favoritos__mensaje">{{ error }}</p>
    </ion-text>
  } @else {
    <app-list-card
      [titulo]="segmentoActual === 'anime' ? 'Mis animes' : 'Mis mangas'"
      [subTitulo]="
        segmentoActual === 'anime'
          ? 'La lista de mis animes favoritos en un solo lugar'
          : 'La lista de mis mangas favoritos en un solo lugar'
      "
      [items]="items"
      [loading]="loading"
      (quitarItem)="quitar($event)"
    ></app-list-card>
  }
</ion-content>
