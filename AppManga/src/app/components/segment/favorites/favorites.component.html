<ion-header>
  <ion-toolbar>
    <app-media-segment
      [valor]="segmentoActual"
      (valorChange)="cambiarSegmento($event)"
    ></app-media-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (sinSesion) {
    <div class="favoritos__mensaje">
      <p>Inicia sesión para ver tus favoritos.</p>
      <ion-button routerLink="/login">Ir a iniciar sesión</ion-button>
    </div>
  } @else if (error) {
    <ion-text color="danger">
      <p class="favoritos__mensaje">{{ error }}</p>
    </ion-text>
  } @else {
    <app-pagination
      [paginaActual]="paginaActual"
      [totalPaginas]="totalPaginas"
      [cargando]="loading"
      (cambioPagina)="cambiarPagina($event)"
    ></app-pagination>

    <app-list-card
      [titulo]="segmentoActual === 'anime' ? 'Mis animes' : 'Mis mangas'"
      [subTitulo]="
        segmentoActual === 'anime'
          ? 'La lista de mis animes favoritos en un solo lugar'
          : 'La lista de mis mangas favoritos en un solo lugar'
      "
      [items]="itemsVisibles"
      [loading]="loading"
      (quitarItem)="quitar($event)"
    ></app-list-card>

    <app-pagination
      [paginaActual]="paginaActual"
      [totalPaginas]="totalPaginas"
      [cargando]="loading"
      (cambioPagina)="cambiarPagina($event)"
    ></app-pagination>
  }
</ion-content>
